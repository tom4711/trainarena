<?xml version="1.0" encoding="UTF-8"?>
<!-- TrainArena logo-icon: hand-authored from Konzept-A draft (same method as Finanzuebersicht appiconfg.svg). Brand: #0032C3 -> #0ACDDE -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="TrainArena">
  <title>TrainArena</title>
  <defs>
    <linearGradient id="gradT" x1="165" y1="279" x2="424" y2="724" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0032C3"/>
      <stop offset="40%" stop-color="#0048C8"/>
      <stop offset="100%" stop-color="#0078E0"/>
    </linearGradient>
    <linearGradient id="gradA" x1="388" y1="279" x2="877" y2="722" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0032C3"/>
      <stop offset="35%" stop-color="#0080E8"/>
      <stop offset="100%" stop-color="#0ACDDE"/>
    </linearGradient>
  </defs>
  <!-- T: top bar + stem (silhouette from logo-icon-source.png) -->
  <polygon fill="url(#gradT)"
           points="596,279 244,280 165,378 321,381 322,724 424,622 424,381 497,382 566,317"/>
  <!-- A: triangle with inner notch -->
  <polygon fill="url(#gradA)"
           points="630,279 388,720 484,721 619,478 698,619 616,621 537,722 877,722"/>
</svg>
