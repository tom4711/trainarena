<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" href="/assets/brand/favicon.png" type="image/png" />
  <title>TrainArena — Spieler</title>
  <link rel="stylesheet" href="player.css" />
</head>
<body>
  <main class="player">
    <div class="brand-row">
      <img class="brand-mark" src="/assets/brand/logo-icon.png" width="64" height="64" alt="" />
      <h1>TrainArena</h1>
    </div>
    <p class="tagline">Spieler</p>

    <section id="join" class="panel">
      <label>Raum-Code
        <input id="code" maxlength="6" autocomplete="off" placeholder="ABC123" inputmode="text" enterkeyhint="next" />
      </label>
      <label>Nickname
        <input id="nickname" maxlength="24" autocomplete="nickname" placeholder="Dein Name" enterkeyhint="go" />
      </label>
      <button id="btn-join" type="button">Beitreten</button>
      <p class="hint">Tipp: Gleicher Nickname nach Verbindungsabbruch = Wiedereinstieg.</p>
      <p id="join-error" class="error" role="alert" aria-live="assertive"></p>
    </section>

    <section id="wait" class="panel hidden">
      <div class="wait-dot" aria-hidden="true"></div>
      <p>Verbunden als <strong id="me"></strong>.</p>
      <p class="hint" style="margin-top:0.45rem">Warte auf die nächste Frage…</p>
    </section>

    <section id="question" class="panel hidden">
      <div class="q-meta">
        <p id="q-progress" class="muted"></p>
        <p id="q-timer" class="timer" aria-live="polite"></p>
      </div>
      <h2 id="q-text"></h2>
      <img id="q-image" class="q-image hidden" alt="" />
      <div id="powerups" class="powerups hidden" aria-label="Power-Ups"></div>
      <div id="answers" class="answers"></div>
      <p id="answer-status" class="muted" aria-live="polite"></p>
    </section>

    <section id="board" class="panel hidden board">
      <h2>Rangliste</h2>
      <ol id="board-list"></ol>
      <p id="wait-host" class="muted hidden">Warte auf den Host (nächste Frage)…</p>
      <p id="board-auto-advance" class="timer hidden" aria-live="polite"></p>
      <p id="done" class="hidden">Runde beendet — danke!</p>
    </section>

    <div id="target-picker" class="target-picker hidden" role="dialog" aria-modal="true" aria-labelledby="target-picker-title">
      <div class="target-picker-card">
        <h2 id="target-picker-title">Störimpuls — Ziel wählen</h2>
        <p class="hint">Wen willst du stören? (noch nicht geantwortet)</p>
        <div id="target-list" class="target-list"></div>
        <button id="btn-target-cancel" type="button" class="secondary">Abbrechen</button>
      </div>
    </div>

    <div id="fx-overlay" class="fx-overlay hidden" aria-live="assertive" aria-atomic="true">
      <div class="fx-burst" aria-hidden="true"></div>
      <p id="fx-title" class="fx-title"></p>
      <p id="fx-sub" class="fx-sub"></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script>
  <script src="player.js"></script>
</body>
</html>
