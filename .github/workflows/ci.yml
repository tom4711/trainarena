name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: .NET test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore TrainArena.sln

      - name: Build
        run: dotnet build TrainArena.sln -c Release --no-restore

      - name: Test
        run: dotnet test TrainArena.sln -c Release --no-build --verbosity normal

  docker:
    name: Docker build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve app version
        id: ver
        run: |
          set -euo pipefail
          dotnet restore src/TrainArena/TrainArena.csproj
          ver=$(dotnet msbuild src/TrainArena/TrainArena.csproj /t:MinVer -getProperty:MinVerVersion -nologo | tr -d '[:space:]')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "MinVer Version=$ver"

      - name: Build image
        run: docker build --build-arg APP_VERSION="${{ steps.ver.outputs.version }}" -t trainarena:ci .
