name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: ubuntu-latest
            artifact: trainarena-win-x64.zip
          - rid: linux-x64
            os: ubuntu-latest
            artifact: trainarena-linux-x64.tar.gz
          - rid: osx-arm64
            os: macos-14
            artifact: trainarena-osx-arm64.tar.gz
          - rid: osx-x64
            os: macos-14
            artifact: trainarena-osx-x64.tar.gz

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained
        run: |
          set -euo pipefail
          dotnet restore src/TrainArena/TrainArena.csproj
          extra=()
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
            extra+=(-p:MinVerVersionOverride="$ver")
            echo "Publishing tag version $ver"
          else
            ver=$(dotnet msbuild src/TrainArena/TrainArena.csproj /t:MinVer -getProperty:MinVerVersion -nologo | tr -d '[:space:]')
            echo "Publishing MinVer Version=$ver"
          fi
          dotnet publish src/TrainArena/TrainArena.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            "${extra[@]}" \
            -o "publish/${{ matrix.rid }}"

      - name: Sign and notarize (macOS)
        if: startsWith(matrix.rid, 'osx-')
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_CERTIFICATE_BASE64}" || -z "${APPLE_API_KEY_BASE64}" ]]; then
            echo "::error::macOS signing secrets missing. See docs/MACOS_SIGNING.md"
            exit 1
          fi
          chmod +x scripts/macos-sign-notarize.sh
          scripts/macos-sign-notarize.sh "publish/${{ matrix.rid }}"

      - name: Pack archive
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${{ matrix.rid }}" == osx-* ]]; then
            cp docs/macos-starten.txt "publish/${{ matrix.rid }}/macos-starten.txt"
          fi
          if [[ "${{ matrix.rid }}" == win-x64 ]]; then
            (cd "publish/${{ matrix.rid }}" && zip -r "../../dist/${{ matrix.artifact }}" .)
          else
            tar -czf "dist/${{ matrix.artifact }}" -C "publish/${{ matrix.rid }}" .
          fi
          ls -lh "dist/${{ matrix.artifact }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
          generate_release_notes: true
          fail_on_unmatched_files: true
