name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            artifact: trainarena-win-x64.zip
          - rid: linux-x64
            artifact: trainarena-linux-x64.tar.gz
          - rid: osx-arm64
            artifact: trainarena-osx-arm64.tar.gz
          - rid: osx-x64
            artifact: trainarena-osx-x64.tar.gz

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained
        run: |
          set -euo pipefail
          ver=$(dotnet msbuild src/TrainArena/TrainArena.csproj /t:MinVer -getProperty:MinVerVersion -nologo | tr -d '[:space:]')
          echo "Publishing MinVer Version=$ver"
          dotnet publish src/TrainArena/TrainArena.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -o "publish/${{ matrix.rid }}"

      - name: Pack archive
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "${{ matrix.rid }}" == win-x64 ]]; then
            (cd "publish/${{ matrix.rid }}" && zip -r "../../dist/${{ matrix.artifact }}" .)
          else
            tar -czf "dist/${{ matrix.artifact }}" -C "publish/${{ matrix.rid }}" .
          fi
          ls -lh "dist/${{ matrix.artifact }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}
          generate_release_notes: true
          fail_on_unmatched_files: true
