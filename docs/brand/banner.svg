<?xml version="1.0" encoding="UTF-8"?>
<!-- TrainArena banner: Logo-A mark + arena hex + wordmark (Finanzuebersicht-style hand SVG). Brand: #0032C3 #0ACDDE #152038 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="TrainArena — Live-Quiz für Ausbildung">
  <title>TrainArena — Live-Quiz für Ausbildung</title>
  <defs>
    <linearGradient id="gradT" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0032C3"/>
      <stop offset="55%" stop-color="#0052C8"/>
      <stop offset="100%" stop-color="#0070D8"/>
    </linearGradient>
    <linearGradient id="gradA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0032C3"/>
      <stop offset="45%" stop-color="#0090E8"/>
      <stop offset="100%" stop-color="#0ACDDE"/>
    </linearGradient>
    <linearGradient id="floor" x1="640" y1="320" x2="640" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8eef5" stop-opacity="0"/>
      <stop offset="100%" stop-color="#d5dee8" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#f7f8fb"/>
  <rect width="1280" height="640" fill="url(#floor)"/>
  <g stroke="#d8e0ea" stroke-width="1" opacity="0.7">
    <line x1="640" y1="300" x2="0" y2="640"/>
    <line x1="640" y1="300" x2="160" y2="640"/>
    <line x1="640" y1="300" x2="320" y2="640"/>
    <line x1="640" y1="300" x2="480" y2="640"/>
    <line x1="640" y1="300" x2="800" y2="640"/>
    <line x1="640" y1="300" x2="960" y2="640"/>
    <line x1="640" y1="300" x2="1120" y2="640"/>
    <line x1="640" y1="300" x2="1280" y2="640"/>
    <line x1="640" y1="300" x2="0" y2="0"/>
    <line x1="640" y1="300" x2="1280" y2="0"/>
  </g>
  <g transform="translate(280,320)">
    <polygon fill="none" stroke="#c5ced9" stroke-width="10" stroke-linejoin="round"
