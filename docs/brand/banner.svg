        <polygon fill="url(#gradA)"
                 points="630,279 388,720 484,721 619,478 698,619 616,621 537,722 877,722"/>
      </g>
    </g>
  </g>
  <text x="520" y="300" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="72" font-weight="700" fill="#152038">TrainArena</text>
  <text x="520" y="360" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="28" font-weight="500" fill="#5a6578">Live-Quiz für Ausbildung</text>
